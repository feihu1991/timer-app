name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build_and_test:
    name: 构建 + 单元测试 + Lint
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 设置 Gradle（无 wrapper，显式指定版本）
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 运行单元测试
        run: gradle testDebugUnitTest --no-daemon

      - name: 运行 Lint
        run: gradle lintDebug --no-daemon

      - name: 构建 debug APK
        run: gradle assembleDebug --no-daemon

      - name: 上传单元测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/

      - name: 上传 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  instrumented_test:
    name: Compose UI 测试（模拟器）
    runs-on: ubuntu-latest
    needs: build_and_test
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 设置 Gradle（无 wrapper，显式指定版本）
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 启用 KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 启动 Android 模拟器并跑 UI 测试
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: gradle connectedDebugAndroidTest --no-daemon

      - name: 上传 instrumentation 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report
          path: app/build/reports/androidTests/

  maestro_test:
    name: Maestro 端到端测试（模拟器）
    runs-on: ubuntu-latest
    needs: build_and_test
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 设置 Gradle（无 wrapper，显式指定版本）
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 启动 Android 模拟器并跑 Maestro 测试
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            curl -Ls "https://get.maestro.mobile.dev" | bash
            export PATH="$PATH:$HOME/.maestro/bin"
            gradle installDebug --no-daemon
            maestro test .maestro/ --format junit --output build/maestro/

      - name: 上传 Maestro 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-report
          path: build/maestro/
